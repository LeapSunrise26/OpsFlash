<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 OpsFlash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06070f; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; user-select: none; overflow: hidden;
  }
  .logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 16px; }
  .name { font-size: 22px; font-weight: 700; }
  .slogan { font-size: 13px; color: rgba(255,255,255,0.5); margin: 4px 0 10px; }
  .version {
    font-size: 12px; color: #FF77B0;
    background: rgba(255,0,80,0.1); padding: 3px 12px;
    border-radius: 16px; display: inline-block;
  }
</style>
</head>
<body>
  <img class="logo" src="{{LOGO_BASE64}}" alt="OpsFlash" />
  <div class="name">OpsFlash</div>
  <div class="slogan">轻量级运维极速引擎</div>
  <div class="version">{{VERSION}}</div>
</body>
</html>
